name: Build NexKey

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows (installer + portable)
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Build macOS (dmg x64 + arm64)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          VER=$(node -p "require('./package.json').version")
          OK=0
          for i in 1 2 3; do
            echo "DMG build attempt $i of 3"
            if npx electron-builder --mac dmg --publish never; then OK=1; break; fi
            echo "Attempt $i failed - cleaning dist and retrying"
            rm -rf dist
            sleep 15
          done
          if [ "$OK" -ne 1 ]; then
            echo "DMG kept failing - building plain zip fallback instead"
            npx electron-builder --mac dir --publish never
            for APP in $(find dist -maxdepth 2 -name "NexKey.app"); do
              case "$APP" in
                *arm64*) SUFFIX="arm64" ;;
                *) SUFFIX="x64" ;;
              esac
              ( cd "$(dirname "$APP")" && ditto -c -k --sequesterRsrc --keepParent NexKey.app "$OLDPWD/NexKey-${VER}-${SUFFIX}-mac.zip" )
            done
            test -n "$(find dist -maxdepth 1 -name '*.zip')"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexKey-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
