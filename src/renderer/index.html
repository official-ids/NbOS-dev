<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'" />
  <title>NexKey</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body data-theme="black">

  <!-- ============ animated background ============ -->
  <div class="bg-anim" aria-hidden="true">
    <div class="bg-ring r1"></div>
    <div class="bg-ring r2"></div>
    <div class="bg-lines"></div>
  </div>

  <div id="app">
    <!-- ============ titlebar ============ -->
    <div id="titlebar">
      <div class="tb-left">
        <svg class="ic tb-logo-ic"><use href="#i-logo" /></svg>
        <span class="tb-name">NexKey</span>
      </div>
      <div class="tb-btns">
        <button id="tb-min" class="tb-btn" data-i18n-title="titlebar.min"><svg class="ic"><use href="#i-min" /></svg></button>
        <button id="tb-max" class="tb-btn" data-i18n-title="titlebar.max"><svg class="ic"><use href="#i-max" /></svg></button>
        <button id="tb-close" class="tb-btn tb-close" data-i18n-title="titlebar.close"><svg class="ic"><use href="#i-x" /></svg></button>
      </div>
    </div>

    <div id="shell">
      <!-- ============ sidebar ============ -->
      <aside id="sidebar">
        <div class="brand">
          <div class="brand-tile"><svg class="ic"><use href="#i-logo" /></svg></div>
          <div class="brand-text">
            <span class="brand-name">NexKey</span>
            <span class="brand-tag" data-i18n="app.tagline"></span>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active" data-view="bindings">
            <svg class="ic"><use href="#i-list" /></svg><span data-i18n="nav.bindings"></span>
          </button>
          <button class="nav-item" data-view="settings">
            <svg class="ic"><use href="#i-gear" /></svg><span data-i18n="nav.settings"></span>
          </button>
        </nav>

        <div class="side-block">
          <div class="side-block-label">
            <svg class="ic"><use href="#i-bolt" /></svg>
            <span data-i18n="nav.active"></span>
          </div>
          <button id="pause-switch" class="switch on" role="switch" aria-checked="true" aria-label="hotkeys">
            <span class="knob"></span>
          </button>
        </div>

        <div id="status-chip" class="status-chip on">
          <span class="dot"></span>
          <span id="status-text" data-i18n="nav.active"></span>
        </div>

        <div class="side-footer">
          <div class="side-footer-line">NsOS Dev x 76 School</div>
          <div class="side-footer-line dim" id="ver-label">v1.0.0</div>
        </div>
      </aside>

      <!-- ============ content ============ -->
      <main id="content">
        <!-- bindings view -->
        <section id="view-bindings" class="view active">
          <div class="page-head">
            <div class="page-head-text">
              <h1 data-i18n="view.bindings"></h1>
              <div class="page-sub" id="stat-line"></div>
            </div>
            <button id="btn-add" class="btn btn-solid btn-add">
              <svg class="ic"><use href="#i-plus" /></svg><span data-i18n="btn.add"></span>
            </button>
          </div>

          <div id="paused-banner" class="paused-banner" hidden>
            <svg class="ic"><use href="#i-pause" /></svg>
            <span data-i18n="view.pausedNote"></span>
          </div>

          <div class="toolbar">
            <div class="search">
              <svg class="ic"><use href="#i-search" /></svg>
              <input id="search" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="search.ph" />
            </div>
            <div class="chips" id="filters">
              <button class="chip active" data-filter="all" data-i18n="filter.all"></button>
              <button class="chip" data-filter="app" data-i18n="filter.app"></button>
              <button class="chip" data-filter="site" data-i18n="filter.site"></button>
              <button class="chip" data-filter="file" data-i18n="filter.file"></button>
            </div>
          </div>

          <div id="binding-list" class="binding-list"></div>

          <div id="empty-state" class="empty" hidden>
            <div class="empty-art">
              <svg class="ic"><use href="#i-keyboard" /></svg>
              <div class="empty-ring"></div>
            </div>
            <h2 data-i18n="empty.title"></h2>
            <p data-i18n="empty.text"></p>
            <button id="btn-empty-add" class="btn btn-solid">
              <svg class="ic"><use href="#i-plus" /></svg><span data-i18n="empty.cta"></span>
            </button>
          </div>
        </section>

        <!-- settings view -->
        <section id="view-settings" class="view">
          <div class="page-head">
            <div class="page-head-text">
              <h1 data-i18n="view.settings"></h1>
            </div>
          </div>

          <div class="sec">
            <div class="sec-title" data-i18n="settings.general"></div>

            <div class="row">
              <div class="row-text">
                <div class="row-name" data-i18n="settings.language"></div>
              </div>
              <div class="seg" id="set-lang">
                <button data-lang="en">English</button>
                <button data-lang="ru">Русский</button>
              </div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-name" data-i18n="settings.theme"></div>
              </div>
              <div class="seg" id="set-theme">
                <button data-theme="black" data-i18n="settings.themeBlack"></button>
                <button data-theme="white" data-i18n="settings.themeWhite"></button>
              </div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-name" data-i18n="settings.autostart"></div>
                <div class="row-hint" data-i18n="settings.autostartHint"></div>
              </div>
              <button id="set-autostart" class="switch" role="switch" aria-checked="false"><span class="knob"></span></button>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-name" data-i18n="settings.startHidden"></div>
                <div class="row-hint" data-i18n="settings.startHiddenHint"></div>
              </div>
              <button id="set-hidden" class="switch" role="switch" aria-checked="false"><span class="knob"></span></button>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-name" data-i18n="settings.closeToTray"></div>
                <div class="row-hint" data-i18n="settings.closeToTrayHint"></div>
              </div>
              <button id="set-closetray" class="switch" role="switch" aria-checked="false"><span class="knob"></span></button>
            </div>
          </div>

          <div class="sec">
            <div class="sec-title" data-i18n="settings.behavior"></div>

            <div class="row">
              <div class="row-text">
                <div class="row-name" data-i18n="settings.notifications"></div>
                <div class="row-hint" data-i18n="settings.notificationsHint"></div>
              </div>
              <button id="set-notif" class="switch" role="switch" aria-checked="false"><span class="knob"></span></button>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-name" data-i18n="settings.autoUpdate"></div>
                <div class="row-hint" data-i18n="settings.autoUpdateHint"></div>
              </div>
              <button id="set-autoupd" class="switch" role="switch" aria-checked="false"><span class="knob"></span></button>
            </div>
          </div>

          <div class="sec">
            <div class="sec-title" data-i18n="settings.data"></div>
            <div class="btn-row">
              <button id="set-export" class="btn btn-ghost"><svg class="ic"><use href="#i-export" /></svg><span data-i18n="settings.export"></span></button>
              <button id="set-import" class="btn btn-ghost"><svg class="ic"><use href="#i-import" /></svg><span data-i18n="settings.import"></span></button>
              <button id="set-resetstats" class="btn btn-ghost"><svg class="ic"><use href="#i-refresh" /></svg><span data-i18n="settings.resetStats"></span></button>
              <button id="set-resetall" class="btn btn-ghost btn-danger"><svg class="ic"><use href="#i-trash" /></svg><span data-i18n="settings.resetAll"></span></button>
            </div>
          </div>

          <div class="sec sec-about">
            <div class="sec-title" data-i18n="settings.about"></div>
            <div class="about">
              <div class="about-left">
                <div class="brand-tile big"><svg class="ic"><use href="#i-logo" /></svg></div>
                <div class="about-ver">
                  <div class="about-name">NexKey</div>
                  <div class="about-version"><span data-i18n="settings.aboutVersion"></span> <span id="about-ver">1.0.0</span></div>
                </div>
              </div>
              <div class="about-right">
                <button id="set-checkupd" class="btn btn-ghost"><svg class="ic"><use href="#i-refresh" /></svg><span data-i18n="btn.checkUpdates"></span></button>
                <div class="about-links">
                  <button class="link" data-url="https://github.com/official-ids/NbOS-dev">
                    <svg class="ic"><use href="#i-external" /></svg>GitHub - official-ids/NbOS-dev
                  </button>
                  <button class="link" data-url="https://76school.vercel.app">
                    <svg class="ic"><use href="#i-school" /></svg>76school.vercel.app
                  </button>
                  <button class="link" data-url="https://t.me/nbsp_acc">
                    <svg class="ic"><use href="#i-send" /></svg>@nbsp_acc
                  </button>
                  <button class="link" data-url="mailto:iamytn@duck.com">
                    <svg class="ic"><use href="#i-mail" /></svg>iamytn@duck.com
                  </button>
                </div>
                <div class="about-credits">
                  <div><span class="dim" data-i18n="settings.developedBy"></span> NsOS Dev</div>
                  <div><span class="dim" data-i18n="settings.withSupport"></span> 76 School</div>
                  <div><span class="dim" data-i18n="settings.license"></span> <span data-i18n="settings.licenseVal"></span></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- ============ overlay + modals ============ -->
  <div id="overlay" class="overlay" hidden>

    <!-- add / edit binding -->
    <div id="modal-binding" class="modal" hidden>
      <div class="modal-head">
        <h2 id="bm-title"></h2>
        <button id="bm-close" class="icon-btn"><svg class="ic"><use href="#i-x" /></svg></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <span class="lbl" data-i18n="form.name"></span>
          <input id="f-name" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="form.namePh" />
        </div>

        <div class="field">
          <span class="lbl" data-i18n="form.type"></span>
          <div class="seg seg-3" id="f-type">
            <button data-type="app"><svg class="ic"><use href="#i-app" /></svg><span data-i18n="form.typeApp"></span></button>
            <button data-type="site"><svg class="ic"><use href="#i-globe" /></svg><span data-i18n="form.typeSite"></span></button>
            <button data-type="file"><svg class="ic"><use href="#i-folder" /></svg><span data-i18n="form.typeFile"></span></button>
          </div>
        </div>

        <div class="field">
          <span class="lbl" id="f-target-label" data-i18n="form.target"></span>
          <div class="target-row">
            <input id="f-target" type="text" class="mono" autocomplete="off" spellcheck="false" />
            <button id="f-browse" class="btn btn-ghost"><svg class="ic"><use href="#i-folder" /></svg><span data-i18n="btn.browse"></span></button>
          </div>
        </div>

        <div class="field" id="f-args-row" hidden>
          <span class="lbl" data-i18n="form.args"></span>
          <input id="f-args" type="text" class="mono" autocomplete="off" spellcheck="false" data-i18n-ph="form.argsPh" />
        </div>

        <label class="check" id="f-elevated-row" hidden>
          <input type="checkbox" id="f-elevated" />
          <span class="check-text">
            <span data-i18n="form.elevated"></span>
            <span class="row-hint" data-i18n="form.elevatedHint"></span>
          </span>
        </label>

        <div class="field">
          <span class="lbl" data-i18n="form.hotkey"></span>
          <div id="f-recorder" class="recorder" tabindex="0">
            <span class="rec-chips" id="rec-chips"></span>
            <span class="rec-hint" data-i18n="form.press"></span>
          </div>
          <div class="hint warn" id="f-rec-warn" hidden data-i18n="form.noModWarn"></div>
          <div class="hint err" id="f-rec-err" hidden data-i18n="form.invalid"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button id="f-test" class="btn btn-ghost"><svg class="ic"><use href="#i-play" /></svg><span data-i18n="modal.test"></span></button>
        <div class="spacer"></div>
        <button id="f-cancel" class="btn btn-ghost" data-i18n="btn.cancel"></button>
        <button id="f-save" class="btn btn-solid" data-i18n="btn.save"></button>
      </div>
    </div>

    <!-- generic confirm -->
    <div id="modal-confirm" class="modal modal-sm" hidden>
      <div class="modal-head">
        <h2 id="cf-title"></h2>
        <button id="cf-x" class="icon-btn"><svg class="ic"><use href="#i-x" /></svg></button>
      </div>
      <div class="modal-body">
        <p id="cf-text" class="confirm-text"></p>
      </div>
      <div class="modal-foot">
        <div class="spacer"></div>
        <button id="cf-cancel" class="btn btn-ghost" data-i18n="confirm.cancel"></button>
        <button id="cf-yes" class="btn btn-solid"></button>
      </div>
    </div>

    <!-- welcome -->
    <div id="modal-welcome" class="modal" hidden>
      <div class="welcome-head">
        <div class="brand-tile big"><svg class="ic"><use href="#i-logo" /></svg></div>
        <h2 data-i18n="welcome.title"></h2>
      </div>
      <div class="modal-body">
        <div class="wstep">
          <div class="wnum">01</div>
          <div class="wtext"><div class="wtitle" data-i18n="welcome.s1t"></div><div class="wdesc" data-i18n="welcome.s1d"></div></div>
        </div>
        <div class="wstep">
          <div class="wnum">02</div>
          <div class="wtext"><div class="wtitle" data-i18n="welcome.s2t"></div><div class="wdesc" data-i18n="welcome.s2d"></div></div>
        </div>
        <div class="wstep">
          <div class="wnum">03</div>
          <div class="wtext"><div class="wtitle" data-i18n="welcome.s3t"></div><div class="wdesc" data-i18n="welcome.s3d"></div></div>
        </div>
      </div>
      <div class="modal-foot">
        <div class="spacer"></div>
        <button id="welcome-done" class="btn btn-solid" data-i18n="welcome.done"></button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="i18n.js"></script>
  <script src="locales/en.js"></script>
  <script src="locales/ru.js"></script>
  <script src="app.js"></script>
</body>
</html>
